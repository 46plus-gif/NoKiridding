<!doctype html>
<html lang="ja" class="warning-page">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title data-i18n="warningTitle">文字の違いに注意 — NoKiridding</title>
  <link rel="stylesheet" href="warning.css">
  <script src="i18n.js" defer></script>
  <script src="alphabet-blacklist.js" defer></script>
  <script src="core.js" defer></script>
  <script src="warning.js" defer></script>
</head>
<body>
  <main>
    <svg class="warning-icon" width="36" height="36" viewBox="0 0 36 36" aria-hidden="true">
      <path d="M16.3 6.1a2 2 0 0 1 3.4 0l12 21a2 2 0 0 1-1.7 3H6a2 2 0 0 1-1.7-3Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      <path d="M18 13v8m0 4v1" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
    <h1 data-i18n="warningHeading">文字の違いに注意してください</h1>
    <p class="domain-label" data-i18n="domainLabel">入力した接続先</p>
    <div id="hostname" class="hostname" dir="ltr" aria-label="注意する文字を含む接続先" data-i18n-aria="domainAria"></div>
    <section id="comparison" hidden aria-labelledby="comparison-label">
      <p id="comparison-label" class="domain-label" data-i18n="comparisonLabel">比較した正規ドメイン</p>
      <div id="reference-hostname" class="hostname reference-hostname" dir="ltr"></div>
      <p id="reference-name" class="domain-label"></p>
    </section>
    <ul id="reasons" class="reasons"></ul>
    <p id="outcome" class="outcome"></p>
    <form id="decision" hidden>
      <label class="remember"><input id="remember" type="checkbox"><span data-i18n="remember">この接続先を今後も許可する</span></label>
      <p class="permission-note" data-i18n="permissionNote">チェックしない場合は、このタブだけで許可します。</p>
      <div class="actions">
        <button id="close" type="button" data-i18n="closeTab">このタブを閉じる</button>
        <button id="continue" class="secondary" type="submit" data-i18n="continueButton">続行</button>
      </div>
      <p id="action-error" class="action-error" role="status"></p>
    </form>
    <p class="product-name">NoKiridding · <a href="settings.html" target="_blank" rel="noopener" data-i18n="allowedSites">許可リスト</a></p>
  </main>
</body>
</html>
