<!doctype html>
<html lang="ja" class="warning-page">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title data-i18n="warningTitle">文字の違いに注意 — NoKiridding</title>
  <link rel="stylesheet" href="warning.css">
  <script src="i18n.js" defer></script>
  <script src="alphabet-blacklist.js" defer></script>
  <script src="core.js" defer></script>
  <script src="warning.js" defer></script>
</head>
<body>
  <main>
    <div class="content">
      <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3v5m8-5v5M6 8h12v3a6 6 0 0 1-12 0Zm6 9v4"/></svg>NoKiridding</div>
      <header>
        <div class="intro">
          <h1 data-i18n="warningHeading">文字の違いに注意してください。
このアドレス合っていますか？</h1>
          <div class="status"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="m9 3-7 12a1.2 1.2 0 0 0 1 2h14a1.2 1.2 0 0 0 1-2L11 3a1.2 1.2 0 0 0-2 0Z"/><path d="M10 7v4m0 2v1"/></svg><p id="outcome" class="outcome" role="status"></p></div>
        </div>
        <svg class="plug" viewBox="0 0 210 140" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M0 106h17c16 0 26-12 26-28v-4" stroke="#d6ab7a"/>
          <g transform="rotate(-13 67 65)"><rect x="32" y="44" width="48" height="43" rx="11" fill="#fbe3c7"/><path d="M80 55h17v5H80m0 13h17v5H80M42 44v43"/><path d="M32 65H21"/></g>
          <path d="M210 27h-13c-15 0-28 12-28 27v5" stroke="#d6ab7a"/>
          <g transform="rotate(-13 153 67)" stroke="#ae7a28"><rect x="135" y="45" width="45" height="43" rx="11" fill="#f8eacb"/><path d="M147 56v6m0 10v6M169 45v43M180 66h10"/></g>
          <path d="m108 44 3-8m-2 61 4 7" stroke="#b5473c" stroke-width="1.8"/>
        </svg>
      </header>
      <div class="comparison">
        <div class="row">
          <p id="domain-label" class="row-label domain-label" data-i18n="domainLabel">入力した接続先</p>
          <div id="hostname" class="hostname entered-hostname" dir="ltr" role="textbox" aria-readonly="true" aria-label="注意する文字を含む接続先" data-i18n-aria="domainAria"></div>
          <p id="full-hostname" class="row-label domain-label" hidden></p>
        </div>
        <section id="comparison" class="row" hidden aria-labelledby="comparison-label">
          <p id="comparison-label" class="row-label domain-label" data-i18n="comparisonLabel">比較した正規ドメイン</p>
          <div class="reference-line">
            <div id="reference-hostname" class="hostname reference-hostname" dir="ltr"></div>
            <p id="reference-name" class="domain-label"></p>
          </div>
        </section>
      </div>
      <ul id="reasons" class="reasons"></ul>
      <form id="decision" hidden>
        <label class="remember"><input id="remember" type="checkbox"><span data-i18n="remember">この接続先を今後も許可する</span></label>
        <p class="permission-note" data-i18n="permissionNote">チェックしない場合は、このタブだけで許可します。</p>
        <div class="actions">
          <button id="close" class="primary" type="button" data-i18n="closeTab">このタブを閉じる</button>
          <button id="continue" class="secondary" type="submit" data-i18n="continueButton">続行</button>
        </div>
        <p id="action-error" class="action-error" role="status"></p>
      </form>
    </div>
    <footer class="product-name"><span>NoKiridding</span><a href="settings.html" target="_blank" rel="noopener" data-i18n="allowedSites">許可リスト</a></footer>
  </main>
</body>
</html>
