<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title data-i18n="settingsTitle">許可リスト — NoKiridding</title>
  <link rel="stylesheet" href="warning.css">
  <link rel="stylesheet" href="settings.css">
  <script src="i18n.js" defer></script>
  <script src="alphabet-blacklist.js" defer></script>
  <script src="core.js" defer></script>
  <script src="settings.js" defer></script>
</head>
<body>
  <main class="settings">
    <header>
      <img src="icons/icon-48.png" width="40" height="40" alt="">
      <span>NoKiridding</span>
    </header>
    <h1 data-i18n="allowedSites">許可リスト</h1>
    <p class="intro" data-i18n="settingsIntro">「今後も許可する」で保存した接続先です。削除すると、次に開くときから再び判定します。</p>
    <div class="list-heading"><h2 data-i18n="savedHosts">保存した接続先</h2><span id="count"></span></div>
    <p id="loading" role="status" data-i18n="loading">読み込んでいます。</p>
    <p id="empty" hidden data-i18n="emptyList">保存した接続先はありません。警告画面で「この接続先を今後も許可する」にチェックを付けて続行すると、ここに追加されます。</p>
    <ul id="permissions" class="permission-list" aria-label="保存した接続先" data-i18n-aria="savedHosts"></ul>
    <p id="status" class="list-status" role="status" aria-live="polite"></p>
    <button id="reload" type="button" class="secondary" data-i18n="refreshList">一覧を更新</button>
    <section class="storage-note" aria-labelledby="storage-title">
      <h2 id="storage-title" data-i18n="storageTitle">保存される場所</h2>
      <p data-i18n="storageNote">許可リストは、この端末のChromeプロフィール内に保存されます。外部への送信や、ほかの端末への同期はしません。</p>
      <p data-i18n="removalNote">削除すると、同じ接続先のタブ内だけの許可も解除します。すでに開いているページを閉じる操作ではありません。</p>
    </section>
  </main>
</body>
</html>
